name: Verify Production V2

on:
  push:
    branches:
      - production-v2
  pull_request:
    branches:
      - production-v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and test
        run: mvn -B test
