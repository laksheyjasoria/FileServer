name: FileServer hardening tests

on:
  push:
    branches:
      - hardening/fileserver-production-readiness
  pull_request:
    branches:
      - feature/chunked-file-transfer
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run unit tests
        run: mvn -B -Dtest='!FileServerApplicationTests' test
