<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .container { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; }
        .header { background: #1a73e8; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .button { background: #1a73e8; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .warning { color: #dc3545; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Verify Your Email Address</h1>
        </div>
        <div class="content">
            <p>Hi there,</p>
            <p>Please click the button below to verify your email address:</p>
            <p style="text-align: center;">
                <a href="{{verificationLink}}" class="button">Verify Email</a>
            </p>
            <p>If you didn't create an account with us, you can ignore this email.</p>
            <div class="warning">
                This link will expire in 24 hours.
            </div>
        </div>
    </div>
</body>
</html>
