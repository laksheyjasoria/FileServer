<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - File Server</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* Small profile card overrides */
        .profile-card {
            max-width: 720px;
            margin: 20px auto;
            background: #fff;
            padding: 18px;
            border-radius: 8px
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">
            <span class="logo-icon">📁</span>
            <span class="logo-text">File Server</span>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search files..." id="searchInput">
        </div>
        <div class="user-menu">
            <span id="userEmail" style="font-size: 14px; color: #5f6368;"></span>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-item" data-view="my-drive">
                <span class="icon">📁</span>
                <span>My Drive</span>
            </div>
            <div class="sidebar-item" data-view="shared">
                <span class="icon">👥</span>
                <span>Shared with me</span>
            </div>
            <div class="sidebar-item" data-view="recent">
                <span class="icon">🕐</span>
                <span>Recent</span>
            </div>
            <div class="sidebar-item active" data-view="profile">
                <span class="icon">👤</span>
                <span>My Profile</span>
            </div>
            <div class="sidebar-item" id="signOutBtn" style="margin-top:auto; color:#d93025;">
                <span class="icon">↩</span>
                <span>Sign Out</span>
            </div>
        </div>

        <div class="main-content">
            <div class="toolbar">
                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item">Profile</span>
                </div>
            </div>

            <div id="fileContainer">
                <div class="profile-card">
                    <h2>Profile</h2>
                    <div style="display:flex;gap:20px;align-items:center">
                        <div style="flex:1">
                            <label>Name</label>
                            <input id="name" />
                            <div style="margin-top:12px">
                                <label>Upload profile photo</label>
                                <input id="photoFile" type="file" accept="image/*" />
                            </div>
                            <div style="margin-top:12px">
                                <button onclick="saveProfile()">Save</button>
                                <button onclick="uploadPhoto()" style="margin-left:8px">Upload Photo</button>
                            </div>
                        </div>
                        <div style="width:140px;text-align:center">
                            <div id="photoPreview"></div>
                        </div>
                    </div>

                    <hr style="margin:20px 0" />
                    <h3>Change Password</h3>
                    <div>
                        <label>Old password</label>
                        <input id="oldPassword" type="password" />
                    </div>
                    <div style="margin-top:12px">
                        <label>New password</label>
                        <input id="newPassword" type="password" />
                    </div>
                    <div style="margin-top:12px">
                        <button onclick="changePassword()">Change Password</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="upload-queue" id="uploadQueue" style="display: none;"></div>

    <script src="/js2/config.js"></script>
    <script>
        function requireAuth() {
            if (!localStorage.getItem('jwtToken')) {
                window.location.href = '/login.html';
                return false;
            }
            return true;
        }

        async function loadProfile() {
            if (!requireAuth()) return;
            try {
                const res = await fetch(`${API_URL}/auth/me`, { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('jwtToken') } });
                const json = await res.json();
                if (res.ok && json.success) {
                    const user = json.data;
                    document.getElementById('name').value = user.name || '';
                    const preview = document.getElementById('photoPreview');
                    if (user.photoUrl) {
                        preview.innerHTML = `<img src="${user.photoUrl}" alt="profile" class="profile-avatar" />`;
                    } else {
                        preview.innerHTML = '<div style="color:#666">No photo uploaded yet.</div>';
                    }
                    const emailElem = document.getElementById('userEmail');
                    emailElem.textContent = user.email || '';
                    const avatar = document.getElementById('userAvatar');
                    if (user.photoUrl) avatar.style.backgroundImage = `url(${user.photoUrl})`;
                } else {
                    alert('Unable to load profile');
                }
            } catch (e) {
                alert('Network error');
            }
        }

        async function saveProfile() {
            if (!requireAuth()) return;
            const name = document.getElementById('name').value;
            try {
                const res = await fetch(`${API_URL}/auth/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('jwtToken') },
                    body: JSON.stringify({ name: name, photoUrl: '' })
                });
                const json = await res.json();
                if (res.ok && json.success) {
                    alert('Profile updated');
                } else {
                    alert(json.message || 'Update failed');
                }
            } catch (e) { alert('Network error'); }
        }

        async function uploadPhoto() {
            if (!requireAuth()) return;
            const fileInput = document.getElementById('photoFile');
            const file = fileInput.files[0];
            if (!file) { alert('Please choose an image'); return; }
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch(`${API_URL}/auth/profile/photo`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('jwtToken') },
                    body: formData
                });
                const json = await res.json();
                if (res.ok && json.success) { alert('Photo uploaded'); loadProfile(); } else { alert(json.message || 'Photo upload failed'); }
            } catch (e) { alert('Network error'); }
        }

        async function changePassword() {
            const oldP = document.getElementById('oldPassword').value;
            const newP = document.getElementById('newPassword').value;
            try {
                const res = await fetch(`${API_URL}/auth/change-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('jwtToken') },
                    body: JSON.stringify({ oldPassword: oldP, newPassword: newP })
                });
                const json = await res.json();
                if (res.ok && json.success) alert('Password changed'); else alert(json.message || 'Failed');
            } catch (e) { alert('Network error'); }
        }

        function signOut() { localStorage.removeItem('jwtToken'); window.location.href = '/login.html'; }

        loadProfile();
    </script>
</body>

</html>
