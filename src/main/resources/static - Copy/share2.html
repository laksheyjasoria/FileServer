<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared File - File Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 900px;
            max-width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .header-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .file-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .file-icon {
            font-size: 48px;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-size: 18px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .file-meta {
            font-size: 13px;
            color: #5f6368;
        }

        .share-info {
            background: #e8f0fe;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #1a73e8;
            text-align: center;
        }

        .share-info.expired {
            background: #fce8e6;
            color: #c5221f;
        }

        .password-section {
            margin-bottom: 24px;
        }

        .password-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #202124;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .password-input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }

        .login-section {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .login-section p {
            margin-bottom: 16px;
            color: #5f6368;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1557b0;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f1f3f4;
            color: #5f6368;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .btn-secondary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .error-message {
            background: #fce8e6;
            color: #c5221f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .viewer-container {
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
            min-height: 400px;
            max-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-container img {
            max-width: 100%;
            max-height: 600px;
            object-fit: contain;
        }

        .viewer-container iframe {
            width: 100%;
            height: 600px;
            border: none;
        }

        .viewer-container video {
            max-width: 100%;
            max-height: 600px;
        }

        .viewer-container audio {
            width: 100%;
            padding: 20px;
        }

        .text-viewer {
            padding: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 600px;
            overflow: auto;
            background: white;
        }

        .expired-message {
            text-align: center;
            padding: 40px;
        }

        .expired-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #5f6368;
        }
    </style>
</head>

<body>
    <div class="container" id="container">
        <div class="header">
            <div class="header-icon">🔗</div>
            <h1>Shared File</h1>
            <p>You have been invited to view this file</p>
        </div>
        <div class="content">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Loading share information...</div>
            </div>
            <div id="contentArea" style="display: none;"></div>
            <div id="viewerArea" style="display: none;"></div>
        </div>
        <div class="footer">
            Powered by File Server
        </div>
    </div>

    <script>
        const API_URL = '';
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        let currentShare = null;
        let currentPassword = null;
        let isExpired = false;

        if (!token) {
            showError('Invalid share link. No token provided.');
        } else {
            loadShareInfo();
        }

        async function loadShareInfo() {
            try {
                const response = await fetch(`${API_URL}/share/${token}`);

                if (response.status === 404 || response.status === 410) {
                    isExpired = true;
                    showExpired();
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to load share information');
                }

                currentShare = await response.json();

                // Check if expired
                if (currentShare.expiresAt && new Date(currentShare.expiresAt) < new Date()) {
                    isExpired = true;
                    showExpired();
                    return;
                }

                displayShareInfo(currentShare);

            } catch (error) {
                console.error('Error loading share:', error);
                showError(error.message);
            }
        }

        function showExpired() {
            document.getElementById('loading').style.display = 'none';
            const contentArea = document.getElementById('contentArea');
            contentArea.style.display = 'block';
            contentArea.innerHTML = `
                <div class="expired-message">
                    <div class="expired-icon">⏰</div>
                    <h3>Link Expired</h3>
                    <p>This share link has expired or is no longer available.</p>
                    <p style="margin-top: 16px; font-size: 13px; color: #5f6368;">Please contact the file owner for a new link.</p>
                </div>
            `;
        }

        function displayShareInfo(share) {
            document.getElementById('loading').style.display = 'none';
            const contentArea = document.getElementById('contentArea');
            contentArea.style.display = 'block';

            const isExpiredStatus = share.expiresAt && new Date(share.expiresAt) < new Date();
            const shareInfoClass = isExpiredStatus ? 'share-info expired' : 'share-info';
            const expiresText = isExpiredStatus ? '⚠️ This link has expired' :
                (share.expiresAt ? `⏰ Expires on ${new Date(share.expiresAt).toLocaleDateString()}` : 'Never expires');

            let html = `
                <div class="file-info">
                    <div class="file-icon">${getFileIcon(share.driveName)}</div>
                    <div class="file-details">
                        <div class="file-name">${escapeHtml(share.driveName)}</div>
                        <div class="file-meta">Shared via ${share.shareType} link • ${share.viewCount} views</div>
                    </div>
                </div>
                <div class="${shareInfoClass}">
                    🔗 This link was created on ${new Date(share.createdAt).toLocaleDateString()}
                    <br>${expiresText}
                </div>
            `;

            if (isExpiredStatus) {
                html += `
                    <div class="expired-message" style="margin-top: 20px;">
                        <p style="color: #c5221f;">This link has expired. No further access is available.</p>
                    </div>
                `;
                contentArea.innerHTML = html;
                return;
            }

            if (share.shareType === 'PROTECTED') {
                html += `
                    <div class="password-section">
                        <label>This file is password protected</label>
                        <input type="password" id="password" class="password-input" placeholder="Enter password">
                        <div class="action-buttons" style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="accessWithPassword()">Access File</button>
                        </div>
                    </div>
                `;
                contentArea.innerHTML = html;
            } else if (share.shareType === 'USER_ONLY') {
                const jwtToken = localStorage.getItem('jwtToken');
                if (jwtToken) {
                    html += `
                        <div class="login-section">
                            <p>✅ You are logged in. You can access this file.</p>
                            <div class="action-buttons">
                                <button class="btn btn-primary" onclick="loadFileContent()">View File</button>
                                <button class="btn btn-secondary" onclick="downloadFile()">Download</button>
                            </div>
                        </div>
                    `;
                    contentArea.innerHTML = html;
                } else {
                    html += `
                        <div class="login-section">
                            <p>🔐 This file is shared with registered users only.</p>
                            <p>Please login to access this file.</p>
                            <button class="btn btn-primary" onclick="redirectToLogin()">Login to Access</button>
                        </div>
                    `;
                    contentArea.innerHTML = html;
                }
            } else {
                // PUBLIC access
                html += `
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="loadFileContent()">👁️ View File</button>
                        <button class="btn btn-secondary" onclick="downloadFile()">⬇️ Download</button>
                    </div>
                `;
                contentArea.innerHTML = html;
            }
        }

        async function accessWithPassword() {
            const password = document.getElementById('password').value;
            if (!password) {
                showTemporaryError('Please enter the password');
                return;
            }

            // Disable button during verification
            const button = document.querySelector('#contentArea .btn-primary');
            button.disabled = true;
            button.textContent = 'Verifying...';

            currentPassword = password;

            try {
                const response = await fetch(`${API_URL}/share/${token}?password=${encodeURIComponent(password)}`);

                if (response.status === 403) {
                    throw new Error('Invalid password');
                }

                if (!response.ok) {
                    throw new Error('Access denied');
                }

                const result = await response.json();

                // Update UI to show view/download buttons
                const contentArea = document.getElementById('contentArea');
                contentArea.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">${getFileIcon(currentShare.driveName)}</div>
                        <div class="file-details">
                            <div class="file-name">${escapeHtml(currentShare.driveName)}</div>
                            <div class="file-meta">Shared via ${currentShare.shareType} link</div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="loadFileContent()">👁️ View File</button>
                        <button class="btn btn-secondary" onclick="downloadFile()">⬇️ Download</button>
                    </div>
                `;

            } catch (error) {
                showTemporaryError('Invalid password. Please try again.');
                button.disabled = false;
                button.textContent = 'Access File';
            }
        }

        async function loadFileContent() {
            const viewerArea = document.getElementById('viewerArea');
            const contentArea = document.getElementById('contentArea');

            viewerArea.style.display = 'block';
            viewerArea.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading file...</div></div>';

            // Disable buttons while loading
            const buttons = document.querySelectorAll('.action-buttons .btn');
            buttons.forEach(btn => btn.disabled = true);

            try {
                let url = `${API_URL}/share/stream/${token}`;
                if (currentPassword) {
                    url += `?password=${encodeURIComponent(currentPassword)}`;
                }

                const response = await fetch(url);

                if (response.status === 403) {
                    throw new Error('Access denied. Invalid password.');
                }

                if (response.status === 410) {
                    throw new Error('This share link has expired');
                }

                if (!response.ok) {
                    throw new Error('Failed to load file');
                }

                const blob = await response.blob();
                const fileUrl = URL.createObjectURL(blob);
                const contentType = blob.type;
                const filename = currentShare.driveName;
                const ext = filename.split('.').pop().toLowerCase();

                displayFileInViewer(fileUrl, contentType, filename, ext);

            } catch (error) {
                viewerArea.innerHTML = `<div class="error-message" style="display: block; text-align: center; margin: 20px;">❌ ${error.message}</div>`;
            } finally {
                buttons.forEach(btn => btn.disabled = false);
            }
        }

        function displayFileInViewer(fileUrl, contentType, filename, ext) {
            const viewerArea = document.getElementById('viewerArea');

            if (contentType.startsWith('image/')) {
                viewerArea.innerHTML = `<div class="viewer-container"><img src="${fileUrl}" alt="${filename}"></div>`;
                return;
            }

            if (contentType === 'application/pdf') {
                viewerArea.innerHTML = `<div class="viewer-container"><iframe src="${fileUrl}" title="${filename}"></iframe></div>`;
                return;
            }

            if (contentType.startsWith('video/')) {
                viewerArea.innerHTML = `<div class="viewer-container"><video controls autoplay><source src="${fileUrl}" type="${contentType}">Your browser does not support video playback.</video></div>`;
                return;
            }

            if (contentType.startsWith('audio/')) {
                viewerArea.innerHTML = `<div class="viewer-container"><audio controls autoplay><source src="${fileUrl}" type="${contentType}">Your browser does not support audio playback.</audio></div>`;
                return;
            }

            if (contentType.startsWith('text/') || ['txt', 'log', 'md', 'csv', 'json', 'xml', 'html', 'css', 'js'].includes(ext)) {
                fetch(fileUrl)
                    .then(res => res.text())
                    .then(text => {
                        viewerArea.innerHTML = `<div class="text-viewer">${escapeHtml(text)}</div>`;
                        URL.revokeObjectURL(fileUrl);
                    })
                    .catch(() => {
                        viewerArea.innerHTML = `<div class="text-viewer">Failed to load text content.</div>`;
                    });
                return;
            }

            viewerArea.innerHTML = `
                <div class="viewer-container" style="flex-direction: column; padding: 40px;">
                    <div style="font-size: 64px; margin-bottom: 20px;">📄</div>
                    <div style="margin-bottom: 20px;">Preview not available for this file type.</div>
                    <button class="btn btn-primary" onclick="downloadFile()">⬇️ Download File</button>
                </div>
            `;
            URL.revokeObjectURL(fileUrl);
        }

        async function downloadFile() {
            let url = `${API_URL}/share/download/${token}`;
            if (currentPassword) {
                url += `?password=${encodeURIComponent(currentPassword)}`;
            }
            window.location.href = url;
        }

        function redirectToLogin() {
            localStorage.setItem('redirectAfterLogin', window.location.href);
            window.location.href = '/login.html';
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄', 'doc': '📝', 'docx': '📝', 'xls': '📊', 'xlsx': '📊',
                'ppt': '📽️', 'pptx': '📽️', 'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️',
                'mp4': '🎥', 'mp3': '🎵', 'zip': '📦', 'txt': '📃'
            };
            return icons[ext] || '📎';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const contentArea = document.getElementById('contentArea');
            contentArea.style.display = 'block';
            contentArea.innerHTML = `
                <div class="error-message" style="display: block; text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 16px;">🔗</div>
                    <h3>Link Not Found</h3>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        function showTemporaryError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.style.display = 'block';
            errorDiv.style.marginBottom = '16px';
            errorDiv.textContent = message;

            const contentArea = document.getElementById('contentArea');
            const existingError = contentArea.querySelector('.error-message');
            if (existingError) existingError.remove();

            contentArea.insertBefore(errorDiv, contentArea.firstChild);

            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
        }
    </script>
</body>

</html>
