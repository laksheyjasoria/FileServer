<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – File Server</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        .reset-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); padding: 20px; }
        .reset-card { background: white; padding: 40px 48px 32px 48px; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .reset-card h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 4px; }
        .reset-card p { color: #5f6368; margin-bottom: 24px; }
        .btn-full { width: 100%; justify-content: center; padding: 10px; font-size: 16px; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #1a73e8; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <h1>🔐 Create New Password</h1>
            <p>Enter your new password below.</p>
            <form id="resetForm">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required />
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
                </div>
                <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
            </form>
            <a href="/login.html" class="back-link">← Back to sign in</a>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/js/core/config.js"></script>
    <script src="/js/core/utils.js"></script>
    <script src="/js/core/api.js"></script>
    <script src="/js/core/toast.js"></script>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showToast('Invalid or missing reset token.', 'error', 3000);
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters.', 'warning');
                return;
            }
            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match.', 'warning');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/reset-password?token=${encodeURIComponent(token)}&password=${encodeURIComponent(newPassword)}`, {
                    method: 'POST'
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    showToast('Password reset successfully! Redirecting...', 'success', 3000);
                    setTimeout(() => window.location.href = '/login.html', 2000);
                } else {
                    showToast(result.message || 'Failed to reset password.', 'error');
                }
            } catch (error) {
                showToast('Network error. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
