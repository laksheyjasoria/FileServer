<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Item - File Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-details h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .file-meta {
            font-size: 13px;
            color: #5f6368;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-primary:hover {
            background: #1557b0;
        }

        .btn-secondary {
            background: #f1f3f4;
            color: #5f6368;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .breadcrumb {
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            cursor: pointer;
            color: #1a73e8;
        }

        .breadcrumb-item:hover {
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: #9aa0a6;
        }

        .selection-toolbar {
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 16px;
        }

        .selection-toolbar.show {
            display: flex;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .file-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            position: relative;
        }

        .file-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-color: #1a73e8;
        }

        .file-item.selected {
            background: #e8f0fe;
            border-color: #1a73e8;
        }

        .checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            display: none;
        }

        .file-item:hover .checkbox,
        .file-item.selected .checkbox {
            display: block;
        }

        .file-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .file-name {
            font-size: 14px;
            word-break: break-word;
        }

        .file-size {
            font-size: 11px;
            color: #5f6368;
            margin-top: 4px;
        }

        .password-section {
            background: white;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            margin: 40px auto;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin: 16px 0;
        }

        .error-message {
            background: #fce8e6;
            color: #c5221f;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .viewer-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .viewer-container img {
            max-width: 100%;
            max-height: 500px;
        }

        .viewer-container iframe {
            width: 100%;
            height: 600px;
            border: none;
        }

        .viewer-container video {
            max-width: 100%;
            max-height: 500px;
        }

        .text-viewer {
            text-align: left;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 500px;
            overflow: auto;
        }

        /* Download Queue Styles */
        .download-queue {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            max-height: 500px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 10000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .download-queue.show {
            display: flex;
        }

        .download-header {
            padding: 12px 16px;
            background: #1a73e8;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .download-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
        }

        .download-item {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-item:last-child {
            border-bottom: none;
        }

        .download-icon {
            font-size: 20px;
        }

        .download-info {
            flex: 1;
        }

        .download-name {
            font-size: 13px;
            font-weight: 500;
            word-break: break-word;
        }

        .download-progress {
            font-size: 11px;
            color: #5f6368;
            margin-top: 4px;
        }

        .download-status {
            font-size: 12px;
        }

        .download-status.completed {
            color: #0d7a0d;
        }

        .download-status.failed {
            color: #dc3545;
        }

        .download-status.downloading {
            color: #1a73e8;
        }

        .cancel-download {
            background: none;
            border: none;
            cursor: pointer;
            color: #dc3545;
            font-size: 16px;
        }

        .queue-progress {
            padding: 8px 16px;
            background: #f1f3f4;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="container" id="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading...</div>
        </div>
        <div id="contentArea" style="display: none;"></div>
        <div id="viewerArea" style="display: none;"></div>
    </div>

    <!-- Download Queue -->
    <div class="download-queue" id="downloadQueue">
        <div class="download-header">
            <span>📥 Download Queue</span>
            <button class="btn btn-secondary" style="background: none; color: white; padding: 4px 8px;"
                onclick="closeDownloadQueue()">✖️</button>
        </div>
        <div class="download-list" id="downloadList"></div>
        <div class="queue-progress" id="queueProgress">Ready to download</div>
    </div>

    <script>
        const API_URL = '';
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        let currentShare = null;
        let currentPassword = null;
        let currentPath = '';
        let selectedItems = new Set();
        let currentContents = [];

        // Download queue
        let downloadQueue = [];
        let isDownloading = false;
        let currentDownloadIndex = 0;

        if (!token) {
            showError('Invalid share link');
        } else {
            loadShareInfo();
        }

        async function loadShareInfo() {
            try {
                const response = await fetch(`${API_URL}/share/${token}`);
                if (!response.ok) throw new Error('Share not found');

                currentShare = await response.json();

                if (currentShare.expiresAt && new Date(currentShare.expiresAt) < new Date()) {
                    showError('This share link has expired');
                    return;
                }

                if (currentShare.shareType === 'PROTECTED') {
                    showPasswordPrompt();
                } else if (currentShare.shareType === 'USER_ONLY') {
                    const jwtToken = localStorage.getItem('jwtToken');
                    if (!jwtToken) {
                        showLoginPrompt();
                    } else {
                        loadSharedItem();
                    }
                } else {
                    loadSharedItem();
                }

            } catch (error) {
                showError(error.message);
            }
        }

        function showPasswordPrompt() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('contentArea').style.display = 'block';
            document.getElementById('contentArea').innerHTML = `
                <div class="password-section">
                    <div style="font-size: 48px; margin-bottom: 16px;">🔒</div>
                    <h2>Password Protected</h2>
                    <p>This item requires a password to access.</p>
                    <input type="password" id="password" class="password-input" placeholder="Enter password">
                    <button class="btn btn-primary" onclick="verifyPassword()">Access</button>
                </div>
            `;
        }

        function showLoginPrompt() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('contentArea').style.display = 'block';
            document.getElementById('contentArea').innerHTML = `
                <div class="password-section">
                    <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
                    <h2>Login Required</h2>
                    <p>This item is shared with registered users only.</p>
                    <button class="btn btn-primary" onclick="redirectToLogin()">Login to Access</button>
                </div>
            `;
        }

        async function verifyPassword() {
            const password = document.getElementById('password').value;
            if (!password) {
                alert('Please enter password');
                return;
            }

            currentPassword = password;

            try {
                const response = await fetch(`${API_URL}/share/${token}?password=${encodeURIComponent(password)}`);
                if (!response.ok) throw new Error('Invalid password');

                loadSharedItem();

            } catch (error) {
                alert('Invalid password');
            }
        }

        async function loadSharedItem() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('contentArea').style.display = 'none';
            document.getElementById('viewerArea').style.display = 'none';

            try {
                let url = `${API_URL}/api/public/share/browse/${token}`;
                if (currentPassword) url += `?password=${encodeURIComponent(currentPassword)}`;
                if (currentPath) url += `${currentPassword ? '&' : '?'}path=${encodeURIComponent(currentPath)}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.itemType === 'FILE') {
                    viewSingleFile(data.id, data.name);
                } else {
                    displayFolder(data);
                }

            } catch (error) {
                showError(error.message);
            }
        }

        function displayFolder(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('contentArea').style.display = 'block';
            document.getElementById('viewerArea').style.display = 'none';

            currentContents = data.contents;
            selectedItems.clear();

            const breadcrumbHtml = buildBreadcrumb(data.currentPath);

            let html = `
                <div class="header">
                    <div class="file-info">
                        <div class="file-icon">📁</div>
                        <div class="file-details">
                            <h1>${escapeHtml(data.name)}</h1>
                            <div class="file-meta">Shared folder • ${data.contents.length} items</div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="downloadSelectedBtn" onclick="downloadSelected()" style="display: none;">📥 Download Selected</button>
                        <button class="btn btn-primary" id="downloadAllBtn" onclick="downloadAll()">📥 Download All (${data.contents.filter(i => i.type === 'FILE').length} files)</button>
                    </div>
                </div>
                
                <div class="breadcrumb">
                    ${breadcrumbHtml}
                </div>
                
                <div class="selection-toolbar" id="selectionToolbar">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
                    <span id="selectionCount">0 selected</span>
                    <button class="btn btn-secondary" onclick="clearSelection()">Clear</button>
                </div>
                
                <div class="file-grid" id="fileGrid">
            `;

            for (const item of data.contents) {
                const icon = item.type === 'FOLDER' ? '📁' : getFileIcon(item.name);
                const size = item.type === 'FILE' ? formatFileSize(item.size) : '';
                const isSelected = selectedItems.has(item.id);

                html += `
                    <div class="file-item ${isSelected ? 'selected' : ''}" 
                         data-id="${item.id}" 
                         data-type="${item.type}" 
                         data-name="${escapeHtml(item.name)}" 
                         onclick="handleItemClick(event, ${item.id}, '${item.type}', '${escapeHtml(item.name)}')"
                         ondblclick="${item.type === 'FOLDER' ? `navigateToPath('${currentPath ? currentPath + '/' + item.name : item.name}')` : `viewFile(${item.id})`}">
                        <input type="checkbox" class="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelectItem(event, ${item.id})">
                        <div class="file-icon">${icon}</div>
                        <div class="file-name">${escapeHtml(item.name)}</div>
                        <div class="file-size">${size}</div>
                    </div>
                `;
            }

            html += `</div>`;
            document.getElementById('contentArea').innerHTML = html;

            updateSelectionToolbar();
        }

        function buildBreadcrumb(path) {
            if (!path) {
                return '<span class="breadcrumb-item" onclick="navigateToPath(\'\')">Root</span>';
            }

            const parts = path.split('/');
            let html = '<span class="breadcrumb-item" onclick="navigateToPath(\'\')">Root</span>';
            let currentPath = '';

            for (let i = 0; i < parts.length; i++) {
                currentPath += (i > 0 ? '/' : '') + parts[i];
                html += `<span class="breadcrumb-separator">/</span>`;
                html += `<span class="breadcrumb-item" onclick="navigateToPath('${currentPath}')">${escapeHtml(parts[i])}</span>`;
            }

            return html;
        }

        function navigateToPath(path) {
            currentPath = path;
            loadSharedItem();
        }

        function handleItemClick(event, id, type, name) {
            if (event.target.type === 'checkbox') return;

            if (type !== 'FOLDER') {
                toggleSelectItem(event, id);
            }
        }

        function toggleSelectItem(event, id) {
            event.stopPropagation();
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
            } else {
                selectedItems.add(id);
            }
            renderFileGrid();
            updateSelectionToolbar();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAllCheckbox').checked;
            if (selectAll) {
                currentContents.forEach(item => {
                    if (item.type === 'FILE') selectedItems.add(item.id);
                });
            } else {
                selectedItems.clear();
            }
            renderFileGrid();
            updateSelectionToolbar();
        }

        function clearSelection() {
            selectedItems.clear();
            renderFileGrid();
            updateSelectionToolbar();
        }

        function updateSelectionToolbar() {
            const count = selectedItems.size;
            const toolbar = document.getElementById('selectionToolbar');
            const selectionCount = document.getElementById('selectionCount');
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            const downloadSelectedBtn = document.getElementById('downloadSelectedBtn');

            if (count > 0) {
                toolbar?.classList.add('show');
                if (selectionCount) selectionCount.textContent = `${count} selected`;
                if (downloadSelectedBtn) {
                    downloadSelectedBtn.style.display = 'inline-flex';
                    downloadSelectedBtn.textContent = `📥 Download Selected (${count})`;
                }
            } else {
                toolbar?.classList.remove('show');
                if (downloadSelectedBtn) downloadSelectedBtn.style.display = 'none';
            }

            if (selectAllCheckbox) {
                const fileCount = currentContents.filter(i => i.type === 'FILE').length;
                selectAllCheckbox.checked = count === fileCount && fileCount > 0;
                selectAllCheckbox.indeterminate = count > 0 && count < fileCount;
            }
        }

        function renderFileGrid() {
            const grid = document.getElementById('fileGrid');
            if (!grid) return;

            let html = '';
            for (const item of currentContents) {
                const icon = item.type === 'FOLDER' ? '📁' : getFileIcon(item.name);
                const size = item.type === 'FILE' ? formatFileSize(item.size) : '';
                const isSelected = selectedItems.has(item.id);

                html += `
                    <div class="file-item ${isSelected ? 'selected' : ''}" 
                         data-id="${item.id}" 
                         data-type="${item.type}" 
                         data-name="${escapeHtml(item.name)}" 
                         onclick="handleItemClick(event, ${item.id}, '${item.type}', '${escapeHtml(item.name)}')"
                         ondblclick="${item.type === 'FOLDER' ? `navigateToPath('${currentPath ? currentPath + '/' + item.name : item.name}')` : `viewFile(${item.id})`}">
                        <input type="checkbox" class="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelectItem(event, ${item.id})">
                        <div class="file-icon">${icon}</div>
                        <div class="file-name">${escapeHtml(item.name)}</div>
                        <div class="file-size">${size}</div>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        // ========== QUEUE-BASED DOWNLOAD ==========

        function downloadSelected() {
            const fileIds = Array.from(selectedItems);
            if (fileIds.length === 0) {
                alert('No files selected');
                return;
            }

            const filesToDownload = currentContents.filter(f => fileIds.includes(f.id));
            startDownloadQueue(filesToDownload);
        }

        function downloadAll() {
            const filesToDownload = currentContents.filter(f => f.type === 'FILE');
            if (filesToDownload.length === 0) {
                alert('No files to download');
                return;
            }

            startDownloadQueue(filesToDownload);
        }

        function startDownloadQueue(files) {
            downloadQueue = files.map(file => ({
                id: file.id,
                name: file.name,
                status: 'pending',
                progress: 0,
                error: null
            }));

            currentDownloadIndex = 0;
            isDownloading = true;

            showDownloadQueue();
            updateQueueDisplay();
            processNextDownload();
        }

        async function processNextDownload() {
            if (!isDownloading) return;

            if (currentDownloadIndex >= downloadQueue.length) {
                // All downloads complete
                isDownloading = false;
                updateQueueProgress('All downloads completed!');
                setTimeout(() => {
                    if (downloadQueue.every(f => f.status === 'completed')) {
                        setTimeout(() => closeDownloadQueue(), 3000);
                    }
                }, 2000);
                return;
            }

            const file = downloadQueue[currentDownloadIndex];
            file.status = 'downloading';
            updateQueueDisplay();

            try {
                let url = `${API_URL}/api/public/share/download-file/${token}?fileId=${file.id}`;
                if (currentPassword) url += `&password=${encodeURIComponent(currentPassword)}`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Download failed');
                }

                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

                file.status = 'completed';
                file.progress = 100;
                updateQueueDisplay();

            } catch (error) {
                file.status = 'failed';
                file.error = error.message;
                updateQueueDisplay();
            }

            currentDownloadIndex++;
            updateQueueProgress(`Downloading ${currentDownloadIndex} of ${downloadQueue.length}`);

            // Small delay between downloads
            setTimeout(() => processNextDownload(), 500);
        }

        function showDownloadQueue() {
            const queue = document.getElementById('downloadQueue');
            queue.classList.add('show');
        }

        function closeDownloadQueue() {
            isDownloading = false;
            document.getElementById('downloadQueue').classList.remove('show');
            downloadQueue = [];
            currentDownloadIndex = 0;
        }

        function cancelAllDownloads() {
            isDownloading = false;
            downloadQueue.forEach(file => {
                if (file.status === 'downloading') {
                    file.status = 'cancelled';
                }
            });
            updateQueueDisplay();
            updateQueueProgress('Download cancelled');
            setTimeout(() => closeDownloadQueue(), 1500);
        }

        function updateQueueDisplay() {
            const list = document.getElementById('downloadList');
            if (!list) return;

            list.innerHTML = '';
            downloadQueue.forEach(file => {
                const statusIcon = file.status === 'completed' ? '✅' :
                    file.status === 'failed' ? '❌' :
                        file.status === 'downloading' ? '⏳' : '⏸';
                const statusClass = file.status === 'completed' ? 'completed' :
                    file.status === 'failed' ? 'failed' :
                        file.status === 'downloading' ? 'downloading' : '';

                list.innerHTML += `
                    <div class="download-item">
                        <div class="download-icon">${statusIcon}</div>
                        <div class="download-info">
                            <div class="download-name">${escapeHtml(file.name)}</div>
                            <div class="download-progress">${file.status === 'downloading' ? 'Downloading...' : file.status === 'completed' ? 'Completed' : file.status === 'failed' ? 'Failed: ' + file.error : 'Pending'}</div>
                        </div>
                        <div class="download-status ${statusClass}">${file.status}</div>
                    </div>
                `;
            });

            const cancelBtn = document.querySelector('#downloadQueue .queue-progress .cancel-btn');
            if (!cancelBtn && downloadQueue.length > 0) {
                const progressDiv = document.getElementById('queueProgress');
                if (progressDiv) {
                    progressDiv.innerHTML = `<span id="progressText">Downloading 0/${downloadQueue.length}</span>
                                            <button class="btn btn-danger" style="padding: 4px 12px; margin-left: 10px;" onclick="cancelAllDownloads()">Cancel All</button>`;
                }
            }
        }

        function updateQueueProgress(message) {
            const progressText = document.getElementById('progressText');
            if (progressText) {
                progressText.textContent = message;
            }
        }

        // ========== FILE VIEWING ==========

        async function viewFile(fileId) {
            document.getElementById('viewerArea').style.display = 'block';
            document.getElementById('viewerArea').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading file...</div></div>';

            try {
                let url = `${API_URL}/api/public/share/view-file/${token}?fileId=${fileId}`;
                if (currentPassword) url += `&password=${encodeURIComponent(currentPassword)}`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to load file');
                }

                const blob = await response.blob();
                const fileUrl = URL.createObjectURL(blob);
                const fileItem = currentContents.find(f => f.id == fileId);
                const filename = fileItem ? fileItem.name : 'file';
                const ext = filename.split('.').pop().toLowerCase();

                displayFileInViewer(fileUrl, blob.type, filename, ext, fileId);

            } catch (error) {
                document.getElementById('viewerArea').innerHTML = `
                    <div class="error-message" style="margin: 20px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
                        <h3>Failed to Load File</h3>
                        <p>${escapeHtml(error.message)}</p>
                        <button class="btn btn-primary" onclick="downloadSingleFile(${fileId})" style="margin-top: 16px;">⬇️ Download Instead</button>
                        <button class="btn btn-secondary" onclick="closeViewer()" style="margin-top: 16px;">✖️ Close</button>
                    </div>
                `;
            }
        }

        async function downloadSingleFile(fileId) {
            const fileItem = currentContents.find(f => f.id == fileId);
            if (!fileItem) return;

            startDownloadQueue([fileItem]);
        }

        async function viewSingleFile(fileId, filename) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('contentArea').style.display = 'none';
            document.getElementById('viewerArea').style.display = 'none';

            try {
                let url = `${API_URL}/api/public/share/view-file/${token}?fileId=${fileId}`;
                if (currentPassword) url += `&password=${encodeURIComponent(currentPassword)}`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to load file');
                }

                const blob = await response.blob();
                const fileUrl = URL.createObjectURL(blob);
                const ext = filename.split('.').pop().toLowerCase();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('viewerArea').style.display = 'block';
                displayFileInViewer(fileUrl, blob.type, filename, ext, fileId);

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showError(error.message);
            }
        }

        function displayFileInViewer(fileUrl, contentType, filename, ext, fileId) {
            const viewerArea = document.getElementById('viewerArea');

            if (contentType.startsWith('image/')) {
                viewerArea.innerHTML = `
                    <div class="viewer-container">
                        <img src="${fileUrl}" alt="${filename}" style="max-width: 100%; max-height: 500px;">
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="downloadSingleFile(${fileId})">⬇️ Download</button>
                            <button class="btn btn-secondary" onclick="closeViewer()">✖️ Close</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (contentType === 'application/pdf') {
                viewerArea.innerHTML = `
                    <div class="viewer-container">
                        <iframe src="${fileUrl}" title="${filename}"></iframe>
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="downloadSingleFile(${fileId})">⬇️ Download</button>
                            <button class="btn btn-secondary" onclick="closeViewer()">✖️ Close</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (contentType.startsWith('video/')) {
                viewerArea.innerHTML = `
                    <div class="viewer-container">
                        <video controls autoplay style="width: 100%; max-height: 500px;">
                            <source src="${fileUrl}" type="${contentType}">
                        </video>
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="downloadSingleFile(${fileId})">⬇️ Download</button>
                            <button class="btn btn-secondary" onclick="closeViewer()">✖️ Close</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (contentType.startsWith('audio/')) {
                viewerArea.innerHTML = `
                    <div class="viewer-container">
                        <audio controls autoplay style="width: 100%;">
                            <source src="${fileUrl}" type="${contentType}">
                        </audio>
                        <div style="margin-top: 16px;">
                            <button class="btn btn-primary" onclick="downloadSingleFile(${fileId})">⬇️ Download</button>
                            <button class="btn btn-secondary" onclick="closeViewer()">✖️ Close</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (contentType.startsWith('text/') || ['txt', 'log', 'md', 'csv', 'json', 'xml', 'html', 'css', 'js'].includes(ext)) {
                fetch(fileUrl)
                    .then(res => res.text())
                    .then(text => {
                        viewerArea.innerHTML = `
                            <div class="viewer-container">
                                <div class="text-viewer">${escapeHtml(text)}</div>
                                <div style="margin-top: 16px;">
                                    <button class="btn btn-primary" onclick="downloadSingleFile(${fileId})">⬇️ Download</button>
                                    <button class="btn btn-secondary" onclick="closeViewer()">✖️ Close</button>
                                </div>
                            </div>
                        `;
                        URL.revokeObjectURL(fileUrl);
                    });
                return;
            }

            viewerArea.innerHTML = `
                <div class="viewer-container">
                    <div style="font-size: 64px; margin-bottom: 20px;">${getFileIcon(filename)}</div>
                    <h3>${escapeHtml(filename)}</h3>
                    <p style="margin: 16px 0;">Preview not available for this file type.</p>
                    <button class="btn btn-primary" onclick="downloadSingleFile(${fileId})">⬇️ Download File</button>
                    <button class="btn btn-secondary" onclick="closeViewer()">✖️ Close</button>
                </div>
            `;
            URL.revokeObjectURL(fileUrl);
        }

        function closeViewer() {
            document.getElementById('viewerArea').style.display = 'none';
            document.getElementById('viewerArea').innerHTML = '';
        }

        function redirectToLogin() {
            localStorage.setItem('redirectAfterLogin', window.location.href);
            window.location.href = '/login.html';
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄', 'doc': '📝', 'docx': '📝', 'xls': '📊', 'xlsx': '📊',
                'ppt': '📽️', 'pptx': '📽️', 'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️',
                'mp4': '🎥', 'mp3': '🎵', 'zip': '📦', 'txt': '📃'
            };
            return icons[ext] || '📎';
        }

        function formatFileSize(bytes) {
            if (!bytes) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return `${(bytes / Math.pow(1024, i)).toFixed(1)} ${sizes[i]}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('contentArea').style.display = 'block';
            document.getElementById('contentArea').innerHTML = `
                <div class="error-message">
                    <div style="font-size: 48px; margin-bottom: 16px;">🔗</div>
                    <h3>Error</h3>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }
    </script>
</body>

</html>
