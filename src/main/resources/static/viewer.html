<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Viewer - File Server</title>
    <!-- Common styles -->
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/toast.css">
    <!-- Page-specific styles -->
    <link rel="stylesheet" href="/css/viewer.css">
</head>
<body>
    <div class="header">
        <div class="file-info">
            <div class="file-icon" id="fileIcon">📄</div>
            <div class="file-details">
                <div class="file-name" id="fileName">Loading...</div>
                <div class="file-meta" id="fileMeta"></div>
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="closeViewer()">✖️ Close</button>
            <button class="btn btn-primary" id="downloadBtn">⬇️ Download</button>
        </div>
    </div>
    <div class="content-area">
        <div class="viewer-container" id="viewerContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Loading file...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js2/config.js"></script>
    <script src="/js2/utils.js"></script>
    <script src="/js2/viewer.js"></script>
    <script src="/js2/toast.js"></script>
</body>
</html>
