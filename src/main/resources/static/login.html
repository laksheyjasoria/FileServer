<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In – File Server</title>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="icon"
	href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>" />

<style>
/* Make Google GSI button full width and match sign-in button */
.google-btn-wrapper {
	width: 100%;
	margin-top: 8px;
}

.google-btn-wrapper .g_id_signin {
	width: 100% !important;
	display: block;
}

.google-btn-wrapper .g_id_signin iframe {
	width: 100% !important;
	min-width: 100% !important;
	border-radius: 10px;
	overflow: hidden;
	height: 44px !important;
}
/* Remove extra margin/padding from the button container */
.google-btn-wrapper .g_id_signin>div {
	margin: 0 !important;
	padding: 0 !important;
}
</style>
</head>
<body>
	<div class="login-container">
		<div class="login-card">
			<div class="login-header">
				<h1>Welcome back</h1>
				<p>Sign in to your peaceful space</p>
			</div>

			<form onsubmit="login(event)">
				<div class="form-group">
					<label>Email address</label> <input type="email" id="email"
						placeholder="Please enter your email address" required />
				</div>
				<div class="form-group">
					<label>Password</label> <input type="password" id="password"
						placeholder="Enter your password" required />
				</div>
				<div class="form-options">
					<label class="remember-me"> <input type="checkbox"
						id="rememberMe" checked /> <span>Remember me</span>
					</label> <a href="#" class="forgot-password">Forgot password?</a>
				</div>
				<button type="submit" class="btn btn-primary btn-full">Sign
					in</button>
			</form>

			<div class="login-divider">
				<span>or continue with</span>
			</div>

			<!-- Google GSI button container -->
			<div class="google-btn-wrapper">
				<div id="g_id_onload" data-callback="handleCredentialResponse">
				</div>

				<div class="g_id_signin" data-type="standard" data-shape="pill"
					data-theme="filled_blue" data-text="continue_with"
					data-size="large" data-width="100%" data-logo_alignment="left">
				</div>
			</div>
			<div class="register-link">
				Don't have an account? <a href="/signup.html">Sign up</a>
			</div>
		</div>
	</div>

	<div id="toast-container"></div>
	<div id="modal-overlay"></div>

	<script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('modal-overlay');
            if (overlay) {
                overlay.classList.remove('active');
                overlay.style.display = 'none';
            }
        });

        async function login(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rememberMe })
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    localStorage.setItem('jwtToken', result.data);
                    localStorage.setItem('userEmail', email);
                    showToast('Login successful. Redirecting...', 'success', 2000);
                    setTimeout(() => window.location.href = '/index.html', 1500);
                } else {
                    showToast(result.message || 'Invalid email or password', 'error');
                }
            } catch (error) {
                showToast('Network error. Please try again.', 'error');
            }
        }
    </script>

	<script src="/js/core/config.js"></script>
	<script src="/js/core/utils.js"></script>
	<script src="/js/core/api.js"></script>
	<script src="/js/core/toast.js?v=2"></script>
	<script src="/js/core/modal.js"></script>

	<!-- Google GSI SDK + Auth handler -->
	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<script src="/js/modules/googleAuth.js"></script>
</body>
</html>
