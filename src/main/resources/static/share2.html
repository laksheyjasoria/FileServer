<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Viewer – Shared</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>"
    />
  </head>
  <body>
    <!-- ===== HEADER (same as main app) ===== -->
    <div id="header-container"></div>

    <!-- ===== APP CONTAINER (no sidebar) ===== -->
    <div class="app-container">
      <main class="main-content" id="shareMainContent">
        <!-- Loading (auto‑hidden) -->
        <div id="loading" class="loading" style="display: flex">
          <div class="spinner"></div>
          <div>Loading share...</div>
        </div>

        <!-- Dynamic content area (replaces fileContainer) -->
        <div id="contentArea" style="display: none"></div>

        <!-- Viewer area (for file previews) -->
        <div id="viewerArea" class="viewer-area" style="display: none"></div>
      </main>
    </div>

    <!-- ===== TOAST & MODAL CONTAINERS ===== -->
    <div id="toast-container"></div>
    <div id="modal-overlay"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/js/core/config.js"></script>
    <script src="/js/core/utils.js"></script>
    <script src="/js/core/api.js"></script>
    <script src="/js/core/toast.js"></script>
    <script src="/js/core/modal.js"></script>
    <script src="/js/ui/navigation.js"></script>
    <script src="/js/ui/header.js"></script>
    <script src="/js/modules/shareView.js"></script>
  </body>
</html>
