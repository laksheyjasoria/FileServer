<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared File - File Server</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/share2.css">
    <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
    <div class="container" id="container">
        <div class="header">
            <div class="header-icon">🔗</div>
            <h1>Shared File / Folder</h1>
            <p>You have been invited to view this content</p>
        </div>
        <div class="content">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Loading share information...</div>
            </div>
            <div id="contentArea" style="display: none;"></div>
            <div id="viewerArea" style="display: none;"></div>
        </div>
        <div class="footer">Powered by File Server</div>
    </div>

    <!-- Download Loading Overlay -->
    <div id="downloadOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 9999; align-items: center; justify-content: center; flex-direction: column;">
        <div class="spinner" style="width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="color: white; margin-top: 20px; font-size: 18px; font-weight: 500;">Preparing your download...</p>
    </div>

    <!-- Scripts -->
    <script src="/js2/config.js"></script>
    <script src="/js2/utils.js"></script>
    <script src="/js2/share2.js"></script>
    <script src="/js2/toast.js"></script>
</body>
</html>
