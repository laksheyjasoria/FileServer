<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Server - Google Drive Clone</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <span class="logo-icon">📁</span>
            <span class="logo-text">File Server</span>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search files..." id="searchInput">
        </div>
        <div class="user-menu">
            <span id="userEmail" style="font-size: 14px; color: #5f6368;"></span>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </div>

    <!-- Selection Toolbar -->
    <div class="selection-toolbar" id="selectionToolbar">
        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
        <span class="selection-count" id="selectionCount">0 items selected</span>
        <div class="selection-actions">
            <button class="icon-btn" onclick="deleteSelected()" title="Delete">🗑️</button>
            <button class="icon-btn" onclick="moveSelected()" title="Move">📁</button>
            <button class="icon-btn" onclick="copySelected()" title="Copy">📋</button>
            <button class="icon-btn" onclick="downloadSelected()" title="Download">⬇️</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-item active" data-view="my-drive">
                <span class="icon">📁</span>
                <span>My Drive</span>
            </div>
            <div class="sidebar-item" data-view="shared">
                <span class="icon">👥</span>
                <span>Shared with me</span>
            </div>
            <div class="sidebar-item" data-view="recent">
                <span class="icon">🕐</span>
                <span>Recent</span>
            </div>
        </div>

        <div class="main-content">
            <div class="toolbar">
                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item" onclick="navigateToParent()">My Drive</span>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-secondary" id="newFolderBtn">
                        📁 New Folder
                    </button>
                    <button class="btn btn-primary" id="uploadBtn">
                        📤 Upload File
                    </button>
                    <input type="file" id="fileInput" multiple style="display: none;">
                </div>
            </div>

            <div id="fileContainer">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Upload Queue -->
    <div class="upload-queue" id="uploadQueue" style="display: none;">
        <div class="upload-header">
            <span>Uploads</span>
            <button class="icon-btn" id="closeUploadQueueBtn" title="Close">✖️</button>
        </div>
        <div id="uploadList"></div>
    </div>

    <!-- Create Folder Modal -->
    <div class="modal" id="folderModal">
        <div class="modal-content">
            <div class="modal-header">New Folder</div>
            <div class="modal-body">
                <input type="text" id="folderName" placeholder="Folder name">
                <div class="private-toggle">
                    <label>
                        <input type="checkbox" id="isPrivate" onchange="togglePasswordField()">
                        <span style="margin-left: 8px;">🔒 Make this folder private</span>
                    </label>
                </div>
                <div id="passwordField" class="password-field">
                    <input type="password" id="folderPassword" placeholder="Enter password">
                    <small>Password required to access this folder (minimum 4 characters)</small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('folderModal')">Cancel</button>
                <button class="btn btn-primary" id="createFolderBtn">Create</button>
            </div>
        </div>
    </div>

    <!-- Move/Copy Modal -->
    <div class="modal" id="moveModal">
        <div class="modal-content">
            <div class="modal-header" id="moveModalTitle">Move to</div>
            <div class="modal-body">
                <select id="destinationFolder"></select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('moveModal')">Cancel</button>
                <button class="btn btn-primary" onclick="executeMove()">Move</button>
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <div class="modal-header">Rename</div>
            <div class="modal-body">
                <input type="text" id="newName" placeholder="New name">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('renameModal')">Cancel</button>
                <button class="btn btn-primary" onclick="executeRename()">Rename</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-header">Create Share Link</div>
            <div class="modal-body">
                <select id="shareType">
                    <option value="PUBLIC">Public - Anyone with link</option>
                    <option value="PROTECTED">Protected - Password required</option>
                    <option value="USER_ONLY">Users Only - Registered users only</option>
                </select>
                <div id="passwordOption" style="display: none;">
                    <input type="password" id="sharePassword" placeholder="Password">
                </div>
                <div id="usersOption" style="display: none;">
                    <input type="text" id="allowedUsers" placeholder="User emails (comma separated)">
                </div>
                <select id="sharePermission">
                    <option value="VIEW">View Only</option>
                    <option value="DOWNLOAD">Download Only</option>
                    <option value="EDIT">View & Download</option>
                </select>
                <input type="datetime-local" id="expiresAt" placeholder="Expires (optional)">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('shareModal')">Cancel</button>
                <button class="btn btn-primary" onclick="createShareLink()">Create Link</button>
            </div>
        </div>
    </div>

    <!-- Share Link Display Modal -->
    <div class="modal" id="shareLinkModal">
        <div class="modal-content">
            <div class="modal-header">Share Link Created</div>
            <div class="modal-body">
                <input type="text" id="shareLink" readonly style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <button class="btn btn-secondary" onclick="copyShareLink()" style="width: 100%;">Copy Link</button>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeModal('shareLinkModal')">Done</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js2/config.js"></script>
    <script src="/js2/utils.js"></script>
    <script src="/js2/api.js"></script>
    <script src="/js2/fileManager.js"></script>
    <script src="/js2/folderManager.js"></script>
    <script src="/js2/uploadManager.js"></script>
    <script src="/js2/shareManager.js"></script>
    <script src="/js2/contextMenu.js"></script>
    <script src="/js2/app.js"></script>
</body>

</html>
