<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – File Server</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .forgot-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
        padding: 20px;
      }
      .forgot-card {
        background: white;
        padding: 40px 48px 32px 48px;
        border-radius: 16px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
      }
      .forgot-card h1 {
        font-size: 1.6rem;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .forgot-card p {
        color: #5f6368;
        margin-bottom: 24px;
      }
      .btn-full {
        width: 100%;
        justify-content: center;
        padding: 10px;
        font-size: 16px;
      }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: #1a73e8;
        text-decoration: none;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="forgot-container">
      <div class="forgot-card">
        <h1>🔑 Reset Password</h1>
        <p>
          Enter your email address and we’ll send you a link to reset your
          password.
        </p>
        <form id="forgotForm">
          <div class="form-group">
            <label>Email address</label>
            <input
              type="email"
              id="resetEmail"
              placeholder="your@email.com"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary btn-full">
            Send reset link
          </button>
        </form>
        <a href="/login.html" class="back-link">← Back to sign in</a>
      </div>
    </div>

    <div id="toast-container"></div>

    <script src="/js/core/config.js"></script>
    <script src="/js/core/utils.js"></script>
    <script src="/js/core/api.js"></script>
    <script src="/js/core/toast.js"></script>

    <script>
      document
        .getElementById("forgotForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("resetEmail").value.trim();
          if (!email) return;
          try {
            const response = await fetch(
              `${API_URL}/auth/forgot-password?email=${encodeURIComponent(email)}`,
              {
                method: "POST",
              },
            );
            const result = await response.json();
            if (response.ok && result.success) {
              showToast("Reset link sent! Check your email.", "success", 4000);
              document.getElementById("resetEmail").value = "";
            } else {
              showToast(
                result.message || "Failed to send reset link.",
                "error",
              );
            }
          } catch (error) {
            showToast("Network error. Please try again.", "error");
          }
        });
    </script>
  </body>
</html>
