<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – User Management</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>">
  <style>
    /* Shared styles (same as logger page) */
    .logger-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .logger-table th, .logger-table td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e0e0e0; }
    .logger-table th { background: #f8f9fa; font-weight: 600; color: #5f6368; }
    .logger-table tr:hover { background: #f5f5f5; }
    .admin-badge { background: #e8f0fe; color: #1a73e8; padding: 4px 12px; border-radius: 16px; font-size: 12px; margin-left: 12px; }

    /* User-specific */
    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-active { background: #d1fae5; color: #065f46; }
    .status-deactivated { background: #fef3c7; color: #92400e; }
    .status-deleted { background: #fee2e2; color: #991b1b; }

    .toolbar .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar .filter-group select,
    .toolbar .filter-group input {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .btn-sm {
      padding: 4px 12px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-activate { background: #d1fae5; color: #065f46; }
    .btn-activate:hover { background: #a7f3d0; }
    .btn-deactivate { background: #fef3c7; color: #92400e; }
    .btn-deactivate:hover { background: #fde68a; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .btn-delete:hover { background: #fecaca; }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .pagination button {
      background: #e5e7eb;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .pagination button:hover:not(:disabled) { background: #d1d5db; }
    .pagination button:disabled { opacity: 0.5; pointer-events: none; }
    .pagination .info { font-size: 0.9rem; color: #6b7280; }

    /* Loading indicator */
    #loadingIndicator { padding: 2rem; text-align: center; color: #6b7280; }
  </style>
</head>
<body>

  <div id="mainApp" style="display: none;">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <span class="logo-icon">👥</span>
        <span class="logo-text">User Management</span>
        <span class="admin-badge">ADMIN</span>
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Search users by email..." id="searchInput">
      </div>
      <div class="user-menu">
        <span id="userEmail" style="font-size: 14px; color: #5f6368;"></span>
        <div class="user-avatar" id="userAvatar">A</div>
      </div>
    </div>

    <!-- Main container -->
    <div class="app-container">
      <!-- Sidebar – will be populated by navigation.js -->
      <div class="sidebar"></div>

      <!-- Main content -->
      <div class="main-content">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="breadcrumb">
            <span class="breadcrumb-item">Users</span>
          </div>
          <div class="filter-group">
            <label for="statusFilter">Status</label>
            <select id="statusFilter">
              <option value="">All</option>
              <option value="ACTIVE">Active</option>
              <option value="DEACTIVATED">Deactivated</option>
              <option value="DELETED">Deleted</option>
            </select>
            <button class="btn btn-primary" id="searchBtn">🔍 Search</button>
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
          </div>
        </div>

        <!-- Table -->
        <div id="userContainer">
          <div id="loadingIndicator" class="loading">Loading users...</div>
          <table class="logger-table" id="userTable" style="display:none;">
            <thead>
              <tr>
                <th>Email</th>
                <th>Name</th>
                <th>Status</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="5" style="text-align:center; color:#9ca3af; padding:2rem;">No users found</td></tr>
            </tbody>
          </table>
          <div class="pagination" id="pagination" style="display:none;">
            <div>
              <button id="prevPage" disabled>Previous</button>
              <button id="nextPage">Next</button>
            </div>
            <div class="info" id="pageInfo">Page 1 of 1</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>
  <div id="modal-overlay"></div>

  <!-- Scripts -->
  <script src="/js/core/config.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/toast.js"></script>
  <script src="/js/core/modal.js"></script>
  <script src="/js/ui/navigation.js"></script>
  <script src="/js/modules/userManagement.js"></script>
</body>
</html>
