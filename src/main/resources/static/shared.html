<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared with me - File Server</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>">
</head>
<body>

    <div class="header">
        <div class="logo">
            <span class="logo-icon">📁</span>
            <span class="logo-text">File Server</span>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search shared items..." id="searchInput">
        </div>
        <div class="user-menu">
            <span id="userEmail" style="font-size:14px; color:#5f6368;"></span>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </div>

    <div class="app-container">
        <div class="sidebar"></div>

        <div class="main-content">
            <div class="toolbar">
                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item">Shared with me</span>
                </div>
            </div>
            <div id="fileContainer">
                <div class="loading">Loading shared items...</div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <div id="modal-overlay"></div>

    <script src="/js/core/config.js"></script>
    <script src="/js/core/utils.js"></script>
    <script src="/js/core/api.js"></script>
    <script src="/js/core/toast.js"></script>
    <script src="/js/core/modal.js"></script>
    <script src="/js/ui/navigation.js"></script>
    <script src="/js/ui/contextMenu.js"></script>
    <script src="/js/modules/shared.js"></script>
</body>
</html>
