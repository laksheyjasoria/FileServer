<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up – File Server</title>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="icon"
	href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📁</text></svg>" />
</head>
<body>
	<div class="login-container">
		<div class="login-card">
			<div class="login-header">
				<h1>Create account</h1>
				<p>Start your peaceful journey</p>
			</div>

			<form onsubmit="register(event)">
				<div class="form-group">
					<label>Full name</label> <input type="text" id="name"
						placeholder="Enter your full name" required />
				</div>
				<div class="form-group">
					<label>Email address</label> <input type="email" id="email"
						placeholder="Please enter your email address" required />
				</div>
				<div class="form-group">
					<label>Password</label> <input type="password" id="password"
						placeholder="Create a strong password" required />
				</div>
				<div class="form-group">
					<label>Profile photo <span class="optional">(optional)</span></label>
					<input type="file" id="signupPhoto" accept="image/*" />
				</div>
				<button type="submit" class="btn btn-primary btn-full">Create
					account</button>
			</form>

			<div class="login-divider">
				<span>or</span>
			</div>

			<!-- Google GSI button container -->
			<div class="google-btn-wrapper">
				<div id="g_id_onload" data-callback="handleCredentialResponse"></div>
				<div class="g_id_signin" data-type="standard"
					data-shape="rectangular" data-theme="outline"
					data-text="signup_with" data-size="large" data-width="full"
					data-logo_alignment="left"></div>
			</div>

			<div class="register-link">
				Already have an account? <a href="/login.html">Sign in</a>
			</div>
		</div>
	</div>

	<div id="toast-container"></div>
	<div id="modal-overlay"></div>

	<script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('modal-overlay');
            if (overlay) {
                overlay.classList.remove('active');
                overlay.style.display = 'none';
            }
        });

        async function register(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const photoFile = document.getElementById('signupPhoto').files[0];

            if (!name || !email || !password) {
                showToast('Please fill in all required fields.', 'warning');
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('password', password);
            if (photoFile) formData.append('file', photoFile);

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    showToast('Registration successful. Redirecting...', 'success', 3000);
                    localStorage.setItem('jwtToken', result.data);
                    localStorage.setItem('userEmail', email);
                    setTimeout(() => window.location.href = '/index.html', 1500);
                } else {
                    showToast(result.message || 'Registration failed', 'error');
                }
            } catch (error) {
                showToast('Network error. Please try again.', 'error');
            }
        }
    </script>

	<script src="/js/core/config.js"></script>
	<script src="/js/core/utils.js"></script>
	<script src="/js/core/api.js"></script>
	<script src="/js/core/toast.js?v=2"></script>
	<script src="/js/core/modal.js"></script>

	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<script src="/js/modules/googleAuth.js"></script>
</body>
</html>
