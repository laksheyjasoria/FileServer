<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - File Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .signup-container { background: white; border-radius: 8px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); width: 400px; max-width: 90%; padding: 40px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon { font-size: 48px; }
        .logo-text { font-size: 24px; font-weight: 500; color: #5f6368; margin-top: 8px; }
        .error-message { background: #fce8e6; color: #c5221f; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; display: none; }
        .success-message { background: #e6f4ea; color: #137333; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; display: none; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #5f6368; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; font-size: 14px; transition: all .2s; }
        .form-group input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.2); }
        .btn-signup { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; transition: background .2s; }
        .btn-signup:hover { background: #1557b0; }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #5f6368; }
        .login-link a { color: #1a73e8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <div class="logo-icon">📁</div>
            <div class="logo-text">File Server</div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form onsubmit="register(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Create a password">
            </div>
            <button type="submit" class="btn-signup">Create Account</button>
        </form>

        <!-- Google Sign-In Container (No hardcoded Client ID) -->
        <div style="margin-top: 20px; text-align: center; border-top: 1px solid #eee; padding-top: 20px;">
            <div id="g_id_onload" data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>

        <div class="login-link">
            Already have an account? <a href="/login.html">Sign In</a>
        </div>
    </div>

    <!-- Global Variables -->
    <script>
        const API_URL = window.location.origin;

        async function register(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    showSuccess("Registration successful. Redirecting...");
                    localStorage.setItem("jwtToken", result.data);
                    localStorage.setItem("userEmail", email);
                    setTimeout(() => { window.location.href = "/index.html"; }, 1200);
                } else {
                    showError(result.message || "Registration failed");
                }
            } catch (e) {
                showError("Network error. Please try again.");
            }
        }

        function showError(message) {
            const div = document.getElementById("errorMessage");
            div.innerText = message;
            div.style.display = "block";
            document.getElementById("successMessage").style.display = "none";
            setTimeout(() => { div.style.display = "none"; }, 3000);
        }

        function showSuccess(message) {
            const div = document.getElementById("successMessage");
            div.innerText = message;
            div.style.display = "block";
            document.getElementById("errorMessage").style.display = "none";
        }
    </script>

    <!-- Google SDK and Common Logic -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/js2/googleAuth.js"></script>
</body>
</html>
